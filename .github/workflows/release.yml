name: Release

# Builds the hoard binary for each platform and attaches it to the GitHub
# Release for a pushed version tag. test.yml is a hard precondition: a broken
# build never produces a release.
#
#   git tag v0.1.0 && git push origin v0.1.0
env:
  M31_REF: v0.7.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release creates the release and uploads assets

jobs:
  test:
    name: Test (precondition)
    uses: ./.github/workflows/test.yml

  build:
    name: Build — ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "Linux x86-64", os: ubuntu-latest, asset: linux-x86_64 }
          - { label: "Linux aarch64", os: ubuntu-24.04-arm, asset: linux-aarch64 }
          - { label: "macOS (arm64)", os: macos-14, asset: macos-arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the m31 release (${{ env.M31_REF }})
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/m31.tar.gz" \
            "https://github.com/qrazil/m31/releases/download/${{ env.M31_REF }}/m31-${{ matrix.asset }}.tar.gz"
          mkdir -p "$RUNNER_TEMP/m31"
          tar -C "$RUNNER_TEMP/m31" -xzf "$RUNNER_TEMP/m31.tar.gz"
          chmod +x "$RUNNER_TEMP/m31/m31c"
          echo "LANGC=$RUNNER_TEMP/m31/m31c" >> "$GITHUB_ENV"
          echo "M31_ROOT=$RUNNER_TEMP/m31" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          OUT=dist/hoard-${{ matrix.asset }}
          mkdir -p "$OUT"
          bash scripts/build.sh -o "$OUT/hoard"
          cp README.md "$OUT/"

      - name: Package
        run: tar -C "dist/hoard-${{ matrix.asset }}" -czf "hoard-${{ matrix.asset }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: hoard-${{ matrix.asset }}
          path: "hoard-${{ matrix.asset }}.tar.gz"
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          path: src

      - name: Checksums and notes
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          # The notes are this version's CHANGELOG section.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' src/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
